name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Required for the merge queue: GitHub dispatches a `merge_group` event for
  # each queued entry and waits on these checks against the projected merge
  # result. Without this, queued PRs would hang forever (checks never report).
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  # Main gets one group PER COMMIT. `cancel-in-progress: false` alone only
  # protects a RUNNING run: GitHub still cancels a PENDING run in the same
  # group when a newer one queues (7 of 30 main pushes died that way,
  # 2026-10), and a cancelled main run never saves its caches. PR /
  # merge_group refs keep one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap (~5s) path-change detector. Other jobs depend on this instead of
  # the ~1h rust-check, so backend-free PRs (web/docs/lockfile-only) skip the
  # expensive Rust compile + test suite while the required checks still report.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust || steps.mergequeue.outputs.full }}
      backend_or_spec: ${{ steps.filter.outputs.backend_or_spec || steps.mergequeue.outputs.full }}
      web: ${{ steps.filter.outputs.web || steps.mergequeue.outputs.full }}
      docker: ${{ steps.filter.outputs.docker || steps.mergequeue.outputs.full }}
      cargo_deps: ${{ steps.filter.outputs.cargo_deps || steps.mergequeue.outputs.full }}
      web_deps: ${{ steps.filter.outputs.web_deps || steps.mergequeue.outputs.full }}
      renovate: ${{ steps.filter.outputs.renovate || steps.mergequeue.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # In the merge queue we validate the actual merged result, so run the
      # full suite rather than path-skipping. paths-filter also has no PR/push
      # base to diff against on a `merge_group` event. `full=true` flows into
      # both outputs above (empty filter output `|| 'true'` → 'true').
      - id: mergequeue
        if: github.event_name == 'merge_group'
        run: echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/ci/migration-roundtrip.sh'
              - '.github/workflows/ci.yml'
            backend_or_spec:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'web/lib/api/openapi.json'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - 'web/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            cargo_deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'
              - 'deny.toml'
              # cargo-audit's ignore list. Without this the job that reads
              # the file is skipped by the very PR that edits it.
              - '.cargo/audit.toml'
              - '.github/workflows/ci.yml'
            web_deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            renovate:
              - 'renovate.json'

  # A malformed packageRule silently disables parts of the update pipeline —
  # renovate logs the error server-side where nobody looks. Validate on the
  # rare PRs that touch the config (dependency-pipeline audit 2026-07-02).
  renovate-config:
    name: Renovate — config validation
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.renovate == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json

  rust-fmt:
    name: Rust — fmt
    runs-on: ubuntu-24.04
    needs: [changes]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every `dtolnay/rust-toolchain@1.96.0` in this file is the MSRV
      # (`rust-version` in Cargo.toml), NOT the dev toolchain pinned in
      # rust-toolchain.toml (which the Dockerfile and local builds use). Compiling + testing on the MSRV is what keeps the declared
      # floor honest. dtolnay publishes version refs as branches, so Renovate
      # never bumps these: raising the MSRV is a deliberate edit of
      # Cargo.toml `rust-version` + these refs in one commit.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      # fmt is pure-syntax and instant — always run it as a cheap guard.
      - name: cargo fmt
        run: |
          start=$(date +%s)
          cargo fmt --all -- --check
          elapsed=$(($(date +%s) - start))
          {
            echo "### Rust fmt timing"
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            echo "| cargo fmt | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-clippy:
    name: Rust — clippy
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: 0
      # The doctest step builds debug artifacts too; keep them small (see the
      # same setting on rust-test).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: clippy
        run: |
          start=$(date +%s)
          cargo clippy --workspace --all-targets -- -D warnings
          elapsed=$(($(date +%s) - start))
          {
            echo "### Rust clippy timing"
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            echo "| cargo clippy | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Doctests run here rather than in `rust-test`: they need a separate
      # rustdoc build of the server crate (~3-4 min) for a handful of
      # examples, and this job finishes long before the test suite does.
      - name: doctests
        run: |
          start=$(date +%s)
          cargo test --workspace --doc
          elapsed=$(($(date +%s) - start))
          echo "| cargo test --doc | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"

  # Sharded 4 ways (`nextest --partition count:N/4`): each shard compiles
  # the same test binaries (shared rust-cache key) and runs a quarter of the
  # tests against its own Postgres + Redis services. rust-check gates on the
  # aggregate matrix result, so the required check name is unchanged.
  rust-test:
    name: Rust — test (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_INCREMENTAL: 0
      # Debuginfo is the bulk of the debug target dir: every one of the ~190
      # server test binaries links the whole server crate, and with line
      # tables each is ~700 MB (measured 2026-10-06), so a cold shard build
      # is well past what a 72 GB runner has left even after the cleanup
      # below (PRs #1054 / #1055 ENOSPC'd twice each; #512 before them).
      # Build CI test binaries with no debuginfo at all: a panic still
      # reports its own file:line (that is compile-time, not debuginfo) and
      # nextest's output names the failing test; only backtrace frames lose
      # their line numbers. `test`/`bench` profiles inherit from `dev`, so
      # this covers nextest binaries and doctests alike.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_STRIP: debuginfo
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: comic
          POSTGRES_PASSWORD: comic
          POSTGRES_DB: comic_reader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comic" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A toolchain bump invalidates every rust-cache key, so this job
      # occasionally runs fully cold — and a cold workspace build (Tesseract/
      # Leptonica C++, ort, dozens of debug test binaries) overflows what's
      # free on a hosted runner. PR #429 died twice this way: first ld
      # SIGBUS (mmap write on a full disk), then an explicit "No space left on
      # device". Since the 2026-07-20 image rollout some runners have 72 GB
      # root disks (vs 145 GB), which re-broke PR #512 — so drop everything
      # this job never touches, before the caches are restored. The whole
      # hostedtoolcache can go: the toolchain comes from rustup and nextest is
      # a prebuilt binary. `docker image prune` keeps the postgres/redis
      # service images (already running) and drops the rest.
      #
      # The cleanup costs ~2.5 min on the critical path. It used to run only
      # below 60 GB free, but a 72 GB runner reports ~60 GB free and then
      # dies mid-link anyway (the runner itself, not the step, hits ENOSPC —
      # the job ends with no failed step and no log). Run it always: a dead
      # shard costs far more than the minutes.
      - name: free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk /opt/microsoft /opt/az \
            /usr/share/miniconda /opt/pipx
          sudo docker image prune -af
          df -h /
      - uses: dtolnay/rust-toolchain@1.96.0
      # One cache entry for all four shards (identical builds). Concurrent
      # saves of the same key are fine: the losers skip "already exists".
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-test
      - name: install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: nextest
      # nextest schedules every binary's tests in one global pool (far better
      # core use than cargo test's one-binary-at-a-time) and auto-retries the
      # rare container flake. The integration harness points at the shared
      # Postgres service via COMIC_TEST_PG_URL and clones a template DB per test
      # (see crates/server/tests/common/mod.rs). Doctests (which nextest
      # doesn't run) live in the clippy job, off this job's critical path.
      - name: test
        run: |
          start=$(date +%s)
          status=0
          cargo nextest run --workspace --profile "$NEXTEST_PROFILE" \
            --partition "count:${{ matrix.shard }}/4" \
            --status-level slow --final-status-level slow || status=$?
          elapsed=$(($(date +%s) - start))
          {
            echo "### Rust test timings (shard ${{ matrix.shard }}/4)"
            echo
            echo "| Command | Duration | Exit |"
            echo "| --- | ---: | ---: |"
            echo "| cargo nextest (build + run) | ${elapsed}s | ${status} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          # renovate/* PRs auto-merge on green, so they get the no-retry
          # profile (.config/nextest.toml `ci-deps`): a retry must never turn
          # an intermittent regression from a dependency bump into a pass.
          NEXTEST_PROFILE: ${{ startsWith(github.head_ref, 'renovate/') && 'ci-deps' || 'ci' }}
          COMIC_TEST_PG_URL: postgres://comic:comic@localhost:5432/comic_reader_test
          COMIC_DATABASE_URL: postgres://comic:comic@localhost:5432/comic_reader_test
          COMIC_REDIS_URL: redis://localhost:6379
      # Per-test timings for tuning shard balance / chasing slow tests
      # (.config/nextest.toml `[profile.*.junit]`).
      - name: Upload nextest junit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-shard-${{ matrix.shard }}
          path: target/nextest/*/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # Migration down-path gate (WP-3.8, audit AR-9): every migration ships a
  # `down`, but nothing ran them. Against a fresh Postgres 18 service DB this
  # applies everything, rolls back the newest 10, asserts the schema equals a
  # DB migrated to exactly `total - 10`, then re-applies and asserts the
  # schema equals the original. Only the small `migration` crate is built.
  # See scripts/ci/migration-roundtrip.sh.
  migration-roundtrip:
    name: Rust — migration down round-trip
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: comic
          POSTGRES_PASSWORD: comic
          POSTGRES_DB: comic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comic" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build migration CLI
        run: cargo build --locked -p migration --bin migration
      - name: up → down -n 10 → up
        run: scripts/ci/migration-roundtrip.sh
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_URL_BASE: postgres://comic:comic@localhost:5432
          MIGRATION_BIN: target/debug/migration
          ROUNDTRIP_COUNT: "10"

  rust-check:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-24.04
    needs: [changes, rust-fmt, rust-clippy, rust-test, migration-roundtrip]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify Rust gates
        run: |
          {
            echo "### Rust gate results"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| fmt | ${{ needs.rust-fmt.result }} |"
            echo "| clippy | ${{ needs.rust-clippy.result }} |"
            echo "| test (all 4 shards) | ${{ needs.rust-test.result }} |"
            echo "| migration round-trip | ${{ needs.migration-roundtrip.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          case "${{ needs.rust-fmt.result }}" in
            success) ;;
            *) echo "::error::rust fmt gate did not pass"; exit 1 ;;
          esac
          case "${{ needs.rust-clippy.result }}" in
            success|skipped) ;;
            *) echo "::error::rust clippy gate did not pass"; exit 1 ;;
          esac
          case "${{ needs.rust-test.result }}" in
            success|skipped) ;;
            *) echo "::error::rust test gate did not pass"; exit 1 ;;
          esac
          case "${{ needs.migration-roundtrip.result }}" in
            success|skipped) ;;
            *) echo "::error::migration round-trip gate did not pass"; exit 1 ;;
          esac

  rust-audit:
    name: Rust — cargo deny / audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # cargo-deny + cargo-audit inspect the dependency tree, so they only need
    # to run when deps change (Cargo.*, deny.toml). The job still RUNS (required
    # check reports) but skips its steps otherwise. The daily sweep
    # (.github/workflows/advisories.yml) catches newly-disclosed advisories
    # in unchanged deps. `cargo_deps` is true for any merge_group entry.
    needs: [changes]
    env:
      DEPS: ${{ needs.changes.outputs.cargo_deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.DEPS == 'true'
      - uses: dtolnay/rust-toolchain@1.96.0
        if: env.DEPS == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.DEPS == 'true'
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: env.DEPS == 'true'
        with:
          command: check
      # Prebuilt binary — avoids the ~1min `cargo install cargo-audit` compile.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        if: env.DEPS == 'true'
        with:
          tool: cargo-audit
      - name: cargo audit
        if: env.DEPS == 'true'
        run: cargo audit

  web-check:
    name: Web — lint / typecheck / test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Job always runs (so the required check always reports), but its steps are
    # gated on web changes — a docs/CHANGELOG-only PR skips the ~3min suite and
    # still goes green. `web` is true for any merge_group entry (full run).
    needs: [changes]
    env:
      WEB: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: env.WEB == 'true'
        with:
          version: 12.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.WEB == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Next.js cache
        if: env.WEB == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.js', 'web/**/*.jsx', 'web/**/*.mjs', 'web/**/*.css', 'web/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Start web timing summary
        if: env.WEB == 'true'
        run: |
          {
            echo "### Web timings"
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile --prefer-offline
          elapsed=$(($(date +%s) - start))
          echo "| install | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      # Per-PR advisory gate (dependency-pipeline audit 2026-07-02): the
      # then-weekly sweep left a Monday-sized window where a fresh
      # high-severity npm advisory shipped silently (advisories.yml is daily now). Prod deps only — dev
      # tooling advisories stay a weekly concern.
      - name: Audit (prod deps)
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm audit --prod --audit-level=high
          elapsed=$(($(date +%s) - start))
          echo "| audit | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Lint
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run lint
          elapsed=$(($(date +%s) - start))
          echo "| lint | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      # Format gate: ESLint doesn't enforce Prettier formatting, so drift
      # accumulated silently on main (~60 files by 2026-07) until a
      # `prettier --write .` in an unrelated branch dragged them all into
      # its diff. Fail fast instead.
      - name: Format check
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run format:check
          elapsed=$(($(date +%s) - start))
          echo "| format:check | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run typecheck
          elapsed=$(($(date +%s) - start))
          echo "| typecheck | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      # Registry gate (audit H1a): query definitions must use the
      # queryKeys registry, never an inline tuple literal.
      - name: Query-key registry gate
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run check-query-keys
          elapsed=$(($(date +%s) - start))
          echo "| check-query-keys | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      # Status-color contrast gate (audit F1/F2): no bare light-shade
      # status text without a dark: fallback (invisible on light themes).
      - name: Status-color contrast gate
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run check-status-colors
          elapsed=$(($(date +%s) - start))
          echo "| check-status-colors | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run test
          elapsed=$(($(date +%s) - start))
          echo "| test | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      # Build once so the bundle-budget script reads a real `.next/`
      # output rather than triggering an implicit build itself.
      - name: Build
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run build
          elapsed=$(($(date +%s) - start))
          echo "| build | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      # WP-4.4: make regressions diagnosable, not just gated. The Turbopack
      # analyzer (`--output`: static UI + data, no second build) runs first
      # so the budget step can attribute every first-load chunk to its
      # largest modules; the per-chunk table lands in the job summary and
      # both go up as the `reader-bundle-report` artifact (open
      # `analyze/index.html` from it with any static server).
      - name: Bundle analyzer
        if: env.WEB == 'true'
        working-directory: web
        run: |
          start=$(date +%s)
          pnpm exec next experimental-analyze --output
          elapsed=$(($(date +%s) - start))
          echo "| next experimental-analyze | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Reader bundle budget
        if: env.WEB == 'true'
        run: |
          start=$(date +%s)
          pnpm --filter web run check-bundle-size --report bundle-report
          elapsed=$(($(date +%s) - start))
          echo "| check-bundle-size | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle report
        if: always() && env.WEB == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-bundle-report
          path: |
            web/bundle-report/
            web/.next/diagnostics/analyze/
          if-no-files-found: ignore
          retention-days: 14
      # Playwright does not run in this job: the specs need a live Rust
      # origin and a seeded library, so they run in the docker-smoke job
      # against the booted production images (reader flow, relationship
      # review, axe a11y checks; see "Playwright e2e" there). Locally:
      # `just docker-build && just docker-e2e`.
      # Blocking as of the 2026-06 dependency audit: the dep tree is
      # high-clean (transitive highs remediated via root
      # `pnpm.overrides`), so a new high-severity advisory now fails CI.
      # Accepted moderates are documented in SECURITY-EXCEPTIONS.md and
      # sit below this `--audit-level=high` gate.
      # Only when deps changed (lockfile/manifest) — code-only web PRs don't
      # alter the dep tree. The daily advisories.yml sweep covers advisory
      # drift in unchanged deps.
      - name: pnpm audit
        if: needs.changes.outputs.web_deps == 'true'
        run: |
          start=$(date +%s)
          pnpm audit --audit-level=high
          elapsed=$(($(date +%s) - start))
          echo "| pnpm audit | ${elapsed}s |" >> "$GITHUB_STEP_SUMMARY"

  openapi-drift:
    name: OpenAPI — snapshot + breaking-change check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Decoupled from rust-check (it builds its own spec); depends only on the
    # ~5s `changes` job so drift feedback isn't queued behind the test suite.
    needs: [changes]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The Rust build (to emit the spec) only matters when backend or the
      # checked-in spec changed; the spec can't have drifted otherwise.
      - uses: dtolnay/rust-toolchain@1.96.0
        if: needs.changes.outputs.backend_or_spec == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.backend_or_spec == 'true'
      - name: Generate spec from PR
        if: needs.changes.outputs.backend_or_spec == 'true'
        # Debug build — the emitted spec is identical to release, and a debug
        # build is far faster on every backend PR.
        run: |
          start=$(date +%s)
          cargo run --bin server -- --emit-openapi > /tmp/pr-openapi.json
          elapsed=$(($(date +%s) - start))
          {
            echo "### OpenAPI timings"
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            echo "| generate spec | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Snapshot match
        if: needs.changes.outputs.backend_or_spec == 'true'
        run: |
          if [ -f web/lib/api/openapi.json ]; then
            diff -q /tmp/pr-openapi.json web/lib/api/openapi.json || \
              (echo "::error::OpenAPI spec drifted from web/lib/api/openapi.json. Run 'just openapi'." && exit 1)
          fi
      # Audit-remediation M10.1 spec-drift gate: regen the generated
      # types and fail if they disagree with the checked-in copy.
      # Catches the case where a contributor commits openapi.json
      # but forgets to run `pnpm openapi:gen`. Node-only + fast, so it
      # always runs (also catches a hand-edited openapi.json / types file).
      - name: Generated TS types match
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile --prefer-offline
          # openapi-typescript is a dependency of the `web` workspace package,
          # not the repo root, so it must be exec'd in the web context — a bare
          # `pnpm exec` from the root fails with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL.
          # (Don't swallow stderr: a silent crash here used to produce an empty
          # output file and a misleading "types are stale" failure.)
          pnpm --filter web exec openapi-typescript lib/api/openapi.json -o /tmp/pr-types.generated.ts
          diff -q /tmp/pr-types.generated.ts web/lib/api/types.generated.ts || \
            (echo "::error::web/lib/api/types.generated.ts is stale. Run 'just openapi'." && exit 1)
          elapsed=$(($(date +%s) - start))
          {
            echo "### OpenAPI timings"
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            echo "| generated TS types | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: oasdiff vs main
        if: github.event_name == 'pull_request' && needs.changes.outputs.backend_or_spec == 'true'
        run: |
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"
          # Surface real git errors (don't swallow stderr); the || branch still
          # handles the expected "no baseline spec on this ref" case.
          git checkout "origin/$BASE_REF" -- web/lib/api/openapi.json || \
            (echo "no baseline spec on $BASE_REF; skipping oasdiff" && exit 0)
          # Pinned: with no `version` the installer resolves "latest" through the
          # unauthenticated GitHub API, which rate-limits shared runners and fails
          # the job (#1032). Renovate bumps this via the regex manager in renovate.json.
          OASDIFF_VERSION=1.33.0
          curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | version="$OASDIFF_VERSION" sh
          # The installer drops the binary in /usr/local/bin (on PATH); invoke
          # it by name, not `./oasdiff` (the old install-to-cwd behavior).
          oasdiff breaking web/lib/api/openapi.json /tmp/pr-openapi.json || \
            ([[ "${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}" == "true" ]] && \
              echo "::warning::Breaking changes detected (acknowledged via label)" || \
              (echo "::error::Breaking API changes — add 'breaking-change' label and update CHANGELOG.md" && exit 1))

  audit-check:
    name: Rust — audit-log enforcement (M10.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Decoupled from rust-check; gated on Rust changes (a handler audit only
    # matters when crates/** changed). Job still reports success when skipped.
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.96.0
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.rust == 'true'
      # AST-walks every handler under crates/server/src/api/ and
      # fails if any RequireAdmin-gated function returns success
      # without calling `record_admin_action!` (or its `audit::record`
      # equivalent). Exemptions in crates/tools/audit-check/allowlist.txt
      # cover read-only admin GETs + delegate-pattern wrappers.
      - name: audit-log enforcement
        if: needs.changes.outputs.rust == 'true'
        run: |
          start=$(date +%s)
          cargo run -p audit-check
          elapsed=$(($(date +%s) - start))
          {
            echo "### Audit-log enforcement timing"
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            echo "| cargo run -p audit-check | ${elapsed}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Source SBOM on every run (~30s): syft over Cargo.lock + pnpm-lock.yaml,
  # SPDX JSON, kept 90 days as a workflow artifact. Answers "what exactly was
  # in the tree at commit X" after the fact without rebuilding anything. The
  # release workflow separately attaches per-IMAGE SBOMs to published images.
  sbom:
    name: SBOM — source (Cargo.lock + pnpm-lock.yaml)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: folio-source-sbom-${{ github.sha }}.spdx.json
          upload-artifact-retention: 90
          dependency-snapshot: false

  docker-build:
    name: Docker — amd64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Runs CONCURRENTLY with the check jobs. It used to wait for rust-check +
    # web-check ("don't burn an image build behind failed checks"), which put
    # a ~30 min image build strictly after a ~50 min test suite. Minutes are
    # free on this public repo; wall-clock isn't. The "only behind green
    # checks" gate now lives on docker-smoke, the required check. Build steps
    # still skip when neither image's inputs changed (e.g. a docs-only PR):
    # the job runs so the matrix contexts report, it just does nothing.
    needs: [changes]
    # MUST be explicit (historically: when this job needed rust-check). A
    # job's implicit condition is `success()`, which is evaluated over the
    # TRANSITIVE ancestor set — so when `rust-clippy` / `rust-test` skip (a
    # non-Rust PR), a dependent skips too, even though `rust-check` itself
    # succeeded via its own `always()`. A skipped matrix
    # job reports ONE check run named `Docker — amd64 build` (bare, no matrix
    # suffix), so the per-image contexts
    #   Docker — amd64 build (folio, Dockerfile)
    #   Docker — amd64 build (folio-web, web/Dockerfile)
    # never appear — and if those are branch-protection required checks, every
    # non-Rust PR blocks forever waiting on a status that cannot arrive.
    # (That is exactly what wedged the v0.27.6 release PR on 2026-08-22.)
    # `always() && <gate>.result == 'success'` keeps the original intent —
    # don't burn an image build behind failed checks — while guaranteeing the
    # matrix expands and both contexts always report.
    if: always() && needs.changes.result == 'success'
    env:
      # Per-image: the server image rebuilds on Rust changes, the web image on
      # web changes; either rebuilds on a Dockerfile change. `docker` is true
      # for any merge_group entry (full run).
      BUILD: ${{ (matrix.image == 'folio' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.docker == 'true')) || (matrix.image == 'folio-web' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.docker == 'true')) }}
      # BuildKit layer cache lives in GHCR as a tag on the image's own
      # (public) package: `folio:buildcache-deps` (the cargo-chef `deps`
      # stage only) and `folio-web:buildcache`. It used to be `type=gha`,
      # whose `mode=max` blobs filled 9 of the 10 GB Actions-cache budget
      # and evicted every rust-cache entry. Anyone can READ it (fork PRs
      # included); only main pushes WRITE it, so a PR that changes deps
      # can't clobber main's cache for every other PR.
      CACHE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      CACHE_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: folio
            dockerfile: Dockerfile
          - image: folio-web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.BUILD == 'true'
      - name: Log in to GHCR (cache write)
        if: env.BUILD == 'true' && env.CACHE_WRITE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # folio: export ONLY the dependency stage. The final `cargo build`
      # layer is per-commit (never a hit for anyone else) and was a 1.3 GB,
      # ~4.5 min upload on every run. On PRs this step is skipped; the image
      # build below reads the same cache ref directly.
      - name: Build + cache dependency layer (folio, main only)
        if: env.BUILD == 'true' && env.CACHE_WRITE == 'true' && matrix.image == 'folio'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: deps
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ env.CACHE_REF }}:buildcache-deps
          cache-to: type=registry,ref=${{ env.CACHE_REF }}:buildcache-deps,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      # The image is exported as a tarball artifact so docker-smoke boots
      # exactly these bytes instead of rebuilding them.
      - name: Build image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.image }}:dev
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image }}.tar
          cache-from: type=registry,ref=${{ env.CACHE_REF }}:${{ matrix.image == 'folio' && 'buildcache-deps' || 'buildcache' }}
          # folio-web's layers are small and its builder stage (pnpm install
          # + next build) is the useful part, so it caches the whole build.
          cache-to: ${{ matrix.image == 'folio-web' && env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.CACHE_REF) || '' }}
      - name: Upload image
        if: env.BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          retention-days: 1
          compression-level: 1

  # A green `docker-build` only proves the images ASSEMBLE. v0.27.5 shipped a
  # folio-web image that built cleanly and then restart-looped on boot:
  # next 16.3.1's standalone file tracer copied @swc/helpers' `cjs/` while
  # Node resolved the `module-sync` condition to `esm/`, so the bundle was
  # silently missing files nothing checks at build time. `compose.test.yml`
  # already existed and would have caught it on the first boot — it just was
  # never wired into CI, only reachable by hand via `just docker-test`.
  #
  # This job closes that gap: it boots both production images against real
  # postgres + redis and asserts /healthz, /readyz and a server-rendered
  # sign-in page. Make it a REQUIRED check alongside `docker-build`.
  docker-smoke:
    name: Docker — image smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Gated on every check that must be green before images are worth
    # booting (docker-build no longer waits for them; it runs alongside).
    # `always()` + explicit results for the transitive-skip reason explained
    # on docker-build. If any of these genuinely failed this job skips and
    # the PR is blocked on that failed required check, not deadlocked here.
    needs: [changes, rust-check, web-check, docker-build]
    if: >-
      always() &&
      needs.rust-check.result == 'success' &&
      needs.web-check.result == 'success' &&
      needs.docker-build.result == 'success'
    env:
      # Gated on the STEPS, not the job — same reason `docker-build` above
      # does it this way: the job must still run so the required check
      # reports. A job skipped by a job-level `if:` can leave a required
      # status unreported and wedge a docs-only PR forever.
      #
      # The smoke stack needs BOTH images, so run whenever either one's
      # inputs moved. `web` already covers pnpm-lock.yaml / package.json /
      # pnpm-workspace.yaml, so a dependency-only PR — which is exactly how
      # v0.27.5 broke — reaches here.
      SMOKE: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SMOKE == 'true'
      # Boot exactly the images docker-build produced (tarball artifacts,
      # tagged `folio:dev` / `folio-web:dev` as compose.test.yml expects).
      # docker-build only builds an image whose inputs changed, so on e.g. a
      # web-only PR there is no `folio` tarball: fall back to the current
      # main build (`:edge`, published by release.yml) re-tagged as `:dev`.
      - name: Download images
        if: env.SMOKE == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load images
        if: env.SMOKE == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for img in folio folio-web; do
            tar="$RUNNER_TEMP/images/$img.tar"
            if [ -f "$tar" ]; then
              echo "loading $img from this run's build"
              docker load -i "$tar"
            else
              echo "$img not rebuilt in this run; using ghcr.io/$OWNER/$img:edge"
              docker pull "ghcr.io/$OWNER/$img:edge"
              docker tag "ghcr.io/$OWNER/$img:edge" "$img:dev"
            fi
          done
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E '^folio(-web)?:dev'
      # Image CVE scan — informational on PRs. Both production images were just
      # loaded into the daemon, so scan them here instead of rebuilding. It
      # never fails the PR: findings are almost always the distroless/alpine
      # base lagging an OS-package fix, which no change in this repo can
      # address — the daily advisories.yml run is the loud alert for that, and
      # the digest refresh Renovate opens (auto-merged) is the fix. HIGH/
      # CRITICAL with an upstream fix only; the table lands in the step summary
      # so the state is visible on every PR without anyone running anything.
      - name: Image CVE scan (folio:dev)
        if: env.SMOKE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: folio:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-folio.txt
      - name: Image CVE scan (folio-web:dev)
        if: env.SMOKE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: folio-web:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-folio-web.txt
          skip-setup-trivy: true
      - name: Image CVE scan summary
        if: env.SMOKE == 'true'
        run: |
          {
            echo "### Image CVE scan (HIGH/CRITICAL with an upstream fix; informational)"
            echo
            echo '```'
            cat trivy-folio.txt trivy-folio-web.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Mirrors `just docker-test`. `up --wait` gates on the healthchecks —
      # the web healthcheck is what a boot-crash trips — then `run --rm smoke`
      # supplies the exit code (--abort-on-container-exit can't be used: the
      # app-init chown container is intentionally short-lived).
      - name: Generate the fixture library
        if: env.SMOKE == 'true'
        run: node web/tests/e2e/fixtures/make-library.mjs
      - name: Smoke test (boot both images, assert endpoints)
        if: env.SMOKE == 'true'
        run: |
          docker compose -f compose.test.yml up -d --wait --wait-timeout 120 postgres redis app web
          docker compose -f compose.test.yml run --rm smoke
      # Browser walk-through against the SAME booted stack, through the Rust
      # origin on localhost:8080: register → library → scan → reader → page
      # turn → progress persisted (web/tests/e2e/reader-flow.spec.ts), plus
      # the relationship review flow and axe on the M7b surfaces
      # (relationship-review.spec.ts; both share the admin session the
      # `setup` project registers). This is the gate that lets web
      # render-path minors auto-merge: it exercises hydration, event
      # handlers, the proxy hop, cookies/CSRF and the scan pipeline, which no
      # vitest or Rust test reaches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: env.SMOKE == 'true'
        with:
          version: 12.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.SMOKE == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install web deps
        if: env.SMOKE == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright browsers
        if: env.SMOKE == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: env.SMOKE == 'true'
        # --with-deps every time (OS libs are not cached); the browser download
        # itself is skipped on a cache hit.
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright e2e (reader flow, relationships, a11y)
        if: env.SMOKE == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: pnpm --filter web exec playwright test
      - name: PWA public-origin assets
        if: env.SMOKE == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: pnpm --filter web run check-pwa-assets
      - name: Upload Playwright results
        if: always() && env.SMOKE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
      - name: Container logs on failure
        if: failure() && env.SMOKE == 'true'
        run: docker compose -f compose.test.yml logs --no-color --tail 200
      - name: Tear down
        if: always() && env.SMOKE == 'true'
        run: docker compose -f compose.test.yml down --volumes --remove-orphans
