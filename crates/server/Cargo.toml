[package]
name = "server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[features]
default = []
# Links a CUDA-enabled ONNX Runtime build (`ort/cuda`, directly and
# through `comic-text-detector/cuda`). That is all it does today: no
# session registers the CUDA execution provider (neither the ones Folio
# builds in `ocr::session` nor the upstream crates' own), so inference
# still runs on the CPU with this feature on. It is kept so a GPU path
# can be added without a manifest change; building with it needs the
# CUDA toolkit and the GPU `onnxruntime` library. Default builds do not
# use it.
cuda = ["ort/cuda", "comic-text-detector/cuda"]

[dependencies]
# Web stack
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }

# Async / concurrency
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# DB
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# Used by the FormOrJson extractor (progressive-enhancement auth forms).
serde_urlencoded = "0.7"

# Request-body validation (audit-remediation M9).
garde = { workspace = true }

# IDs / hashing / crypto
uuid = { workspace = true }
blake3 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
openidconnect = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
data-encoding = { workspace = true }
constant_time_eq = { workspace = true }
chacha20poly1305 = { workspace = true }
arc-swap = { workspace = true }
# Used to urlencode error code + message into 303 redirect targets on the
# progressive-enhancement form-fallback path of the auth handlers.
urlencoding = "2"
zeroize = { workspace = true }
time = { workspace = true }
lettre = { workspace = true }
walkdir = { workspace = true }
notify-debouncer-full = { workspace = true }
rustix = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
# ONNX Runtime sessions for the text-reading engines Folio runs itself
# (`src/ocr/session.rs`): balloon detector, line finder, line recogniser,
# and the Japanese recogniser's encoder and decoder.
ort = { workspace = true }
ndarray = { workspace = true }
# Legacy page detector, used only with `COMIC_OCR_LEGACY_ENGINES=true`
# (`src/ocr/detector.rs`); its model (~95 MB) is fetched on first use.
# Removed together with Tesseract one release after the engine change.
comic-text-detector = { workspace = true }
hf-hub = { workspace = true }
# Exclusive, self-removing temp files for OCR model downloads.
tempfile = "3"
# Legacy Western OCR (`COMIC_OCR_LEGACY_ENGINES=true`): Tesseract 5.5.2 +
# Leptonica 1.87.0 built from source by tesseract-rs 0.4.0. Build script
# compiles natively via cmake;
# cache lives at `~/.tesseract-rs/` and survives `cargo clean`. The
# image build pins those sources (scripts/docker/tesseract-inputs.sh).
tesseract-rs = { workspace = true }
webp = { workspace = true }
fast_image_resize = { workspace = true }
rayon = { workspace = true }
lru = { workspace = true }
globset = { workspace = true }
# Natural ("Issue 2" before "Issue 10") order for a folder's archives;
# the same comparator the archive readers sort pages with.
natord = { workspace = true }

# Background jobs
apalis = { workspace = true }
apalis-redis = { workspace = true }
redis = { workspace = true }
tokio-cron-scheduler = { workspace = true }

# Workspace crates (additional)
parsers = { path = "../parsers" }
archive = { path = "../archive" }

# Time
chrono = { workspace = true }
chrono-tz = { workspace = true }

# Errors / config
thiserror = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
dotenvy = { workspace = true }

# Tracing / metrics
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# NOTE: the opentelemetry / tracing-opentelemetry / OTLP-exporter stack was
# deliberately dropped for v1 (see `observability::init` and
# docs/dev/incompleteness-audit.md §D-9) — the Prometheus `/metrics` endpoint
# covers operator monitoring. The crates sat here unused, dragging a whole
# tonic/gRPC subtree into the build; re-add them when OTLP is actually wired.
log = "0.4"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }

# OpenAPI
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

# Misc
url = { workspace = true }
slug = { workspace = true }
reqwest = { workspace = true }
ipnet = { workspace = true }

# Title normalization (matching-accuracy-1.0 M2): NFKD form folds ligatures
# + accent decomposition before our casefold + article-strip pass, so
# "Pokémon" and "Pokemon" land on the same key. Already pulled in
# transitively via `url`/`idna`; promoting it to direct keeps the call
# site readable.
unicode-normalization = "0.1"

# Used solely for posix_fadvise on Unix (perf hint to kernel readahead before
# BLAKE3-hashing a CBZ). Already a transitive dep via tokio/sqlx; pulling it
# direct keeps the call site clean.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Workspace crates
entity = { path = "../entity" }
migration = { path = "../migration" }
shared = { path = "../shared" }
server-macros = { path = "../server-macros" }

[dev-dependencies]
testcontainers = { workspace = true }
# Harness uses a raw Redis connection to FLUSHDB a per-test logical DB and read
# `CONFIG GET databases` (CI-speed Phase 3 shared-Redis isolation).
redis = { workspace = true }
reqwest = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Independent XML leaf walk for the ComicTagger parity test (WP-6.4) — the
# comparison must not go through Folio's own ComicInfo parser.
quick-xml = { workspace = true }
tower = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
# Builds CBT (tar) fixtures for the archive-edit multi-format tests.
tar = { workspace = true }
filetime = "0.2"
# Encodes tiny PNGs in the variant-cover download tests (the production
# `image` dep isn't visible to the separate integration-test crate).
image = { workspace = true }
# OIDC integration test harness (M6) — mock OP via wiremock, RSA keys for
# id_token signing. Only the keygen + PKCS#1 DER encoding the mock OP needs.
# 0.10 is the release that fixes RUSTSEC-2023-0071 (Marvin), but this does
# not take `rsa` 0.9 out of the build: `openidconnect` 4 depends on it
# unconditionally (RS256 id_token verification) and `jsonwebtoken`'s
# `rust_crypto` backend pulls it too, so deny.toml still accepts the
# advisory until both move to 0.10.
wiremock = "0.6"
rsa = "0.10"
rand = { workspace = true }

[lints]
workspace = true
