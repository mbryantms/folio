[package]
name = "ocr-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Development-only benchmark harness for the OCR pipeline (text detection
# + recognition): per-stage timings and text accuracy against reference
# transcriptions. Drives `server::ocr` directly; never starts the HTTP
# server, Postgres or Redis. Nothing depends on it and the image build
# (`--bin server --bin migration`) does not compile it. See README.md.

[[bin]]
name = "ocr-bench"
path = "src/main.rs"

[dependencies]
server = { path = "../../server" }
anyhow = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
image = { workspace = true }
imageproc = { workspace = true }
# The ONNX Runtime binding and array crate the server links; the
# workspace pins them (one runtime, moved together with the OCR crates).
ndarray = { workspace = true }
ort = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
