# Production compose for Folio. Brings up four services:
#
#   app       — Rust axum server (image: folio).         Bound to 127.0.0.1:8080.
#                                                        The single public-facing service.
#   web       — Next.js SSR upstream (image: folio-web). Internal-only on the
#                                                        compose bridge; reached by `app`
#                                                        as its HTML fallback target.
#   postgres  — schema + user data + auth.               Internal-only.
#   redis     — apalis job queue + rate-limit counters.  Internal-only.
#
# Topology (M5 of the rust-public-origin plan): the Rust binary is the
# public origin. Your reverse proxy points at `app:8080` for everything
# — `/api/*`, `/opds/*`, `/auth/*`, page bytes, WebSockets, AND HTML
# pages. Rust handles its own routes directly and reverse-proxies the
# rest to `web:3000` over the compose bridge via the
# `COMIC_WEB_UPSTREAM_URL` env wired below. You no longer need
# path-based routing in your reverse proxy. See
# [`docs/install/caddy.md`](docs/install/caddy.md) for the simplified
# template.
#
# TLS termination is the operator's responsibility (Caddy / nginx /
# Traefik). `app` binds to loopback by default so it's not directly
# reachable from the network; only the reverse proxy (or a tunnel
# daemon running inside the same host, e.g. cloudflared) is. To expose
# the port directly on the host's LAN interface — for a homelab without
# a proxy, or alongside a tunnel — set `COMIC_APP_BIND=0.0.0.0` in
# `.env`. Do **not** set this on a public-internet host; the binary has
# no TLS of its own.
#
# Reverse-proxy templates live under `docs/install/`:
#   - caddy.md       (default; auto Let's Encrypt)
#   - nginx.md
#   - traefik.md
#   - lan-https-mkcert.md   (homelab without a public domain)
#   - cloudflare.md  (read this if Cloudflare fronts your origin — there
#                     is one required Scrape-Shield toggle to flip)
#
# Required env (typically via .env file alongside this compose):
#   REPO_OWNER                — GitHub user/org that owns the GHCR image
#   POSTGRES_PASSWORD         — Postgres password for the `comic` user
#   COMIC_LIBRARY_HOST_PATH   — absolute path on the host containing your library
#   COMIC_PUBLIC_URL          — public HTTPS URL (e.g. https://comics.example.com)
# Optional:
#   TAG                       — image tag to pull (default: latest)
#   COMIC_APP_BIND            — host interface for the API port (default: 127.0.0.1)
#   REDIS_PASSWORD            — require a password on Redis (default: none).
#                               Letters, digits and - . _ ~ only; read
#                               docs/install/upgrades.md before turning it on
#                               for an existing install.
#
# Hardening (every service): all Linux capabilities dropped and only the
# ones a service's own entrypoint needs added back, `no-new-privileges`,
# and a read-only root filesystem, with writes confined to the named
# volumes plus small tmpfs mounts. Two networks: `default` (app + web;
# carries the published port and the app's outbound access to metadata
# providers) and `backend` (app + postgres + redis; `internal`, so it has
# no route out and the web container cannot reach the databases). Bind
# mounts you add stay writable as declared (`:ro` or not); only the
# image's own filesystem is read-only. compose.test.yml (CI's docker-smoke
# job) applies the same flags to app and web; keep the two in step.

# Bounded container logs for every service. Docker's default json-file
# driver never rotates, so a long-running app container (or a chatty
# Postgres) eventually fills the host disk. 5 files x 10 MB caps each
# container at 50 MB; `docker compose logs` still reads them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Baseline for every service; each adds back (cap_add) only what it needs.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # One-shot: makes sure the `comic_data` volume is writable by the
  # distroless nonroot user (UID 65532). On a fresh deploy the named
  # volume is created root-owned, which prevents the server from
  # creating its `secrets/` subdirectory on first boot. Runs to
  # completion in <1s and exits 0; `app.depends_on` ties the boot order.
  app-init:
    image: alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    restart: "no"
    logging: *default-logging
    <<: *hardening
    # Runs as root to fix ownership: CHOWN for the chown, DAC_READ_SEARCH
    # to walk a /data the server already owns (mode 0700), FOWNER for the
    # chmod of a directory root does not own.
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER]
    network_mode: none
    command:
      - sh
      - -c
      - "mkdir -p /data && chown -R 65532:65532 /data && chmod 0700 /data"
    volumes:
      - comic_data:/data

  app:
    image: ghcr.io/${REPO_OWNER:?REPO_OWNER is required (see .env.prod.example)}/folio:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # The job workers drain in-flight jobs for up to 25 s on SIGTERM
    # (`JOB_SHUTDOWN_TIMEOUT_SECS` in crates/server/src/jobs/mod.rs).
    # Docker's default grace period is 10 s, after which it SIGKILLs the
    # process mid-drain; 35 s leaves the drain room to finish.
    stop_grace_period: 35s
    # Runs as the image's nonroot user (UID 65532) and needs no capability.
    # Its writes go to the `comic_data` volume (secrets, thumbnails, search
    # index, OCR model cache under HOME=/data) and, for writeback libraries,
    # beside the archives in the library mount. /tmp stays writable as the
    # system temp directory for libraries that fall back to one (SQLite can
    # spill a large sort over a local metadata database there).
    <<: *hardening
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      app-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # Internal service names — postgres/redis are on the `backend` network.
      COMIC_DATABASE_URL: postgres://comic:${POSTGRES_PASSWORD:?required}@postgres:5432/comic_reader
      # Carries `:<password>@` only when REDIS_PASSWORD is set.
      COMIC_REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      # SSR fallback upstream. The Rust binary reverse-proxies any path
      # no explicit route handled (HTML pages, `/_next/*` assets, etc.)
      # to Next.js over the compose bridge. `web` is the service name
      # below; the URL is not user-visible.
      COMIC_WEB_UPSTREAM_URL: http://web:3000
      # `COMIC_TRUSTED_PROXIES` lets the rate limiter trust X-Forwarded-For
      # from a reverse proxy on the docker bridge. Without this, every
      # request would appear to come from the gateway IP and the limiter
      # would fail open.
      COMIC_TRUSTED_PROXIES: ${COMIC_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      # Mount the host library at whatever path `COMIC_LIBRARY_PATH`
      # asks the server to scan. Defaults to `/library` (matches the
      # Dockerfile ENV) so a stock install just works without setting
      # either variable. If you want the container path to match the
      # host path (e.g. `/mnt/data` → `/mnt/data` for symmetry between
      # dev and prod), set `COMIC_LIBRARY_PATH=/mnt/data` in `.env` and
      # the mount target follows automatically — no compose edit.
      - ${COMIC_LIBRARY_HOST_PATH:?required}:${COMIC_LIBRARY_PATH:-/library}:ro
      - comic_data:/data
    ports:
      - "${COMIC_APP_BIND:-127.0.0.1}:8080:8080"
    networks: [default, backend]
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/${REPO_OWNER:?REPO_OWNER is required (see .env.prod.example)}/folio-web:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # Runs as the image's nonroot user (UID 65532) and needs no capability,
    # and writes nothing at runtime: images are served unoptimized and no
    # page is regenerated (ISR), so Next never fills `.next/cache`. If a
    # customised build does use that cache, add
    # `tmpfs: ["/app/web/.next/cache:uid=65532,gid=65532"]`.
    <<: *hardening
    # Only the `default` network: web talks to `app` and nothing else.
    networks: [default]
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The API target for Next's `/api/*` rewrite is baked into the web
      # image at *build time* via the Dockerfile's `API_PROXY_URL` ARG
      # (default: `http://app:8080` — this service over the compose
      # bridge). Setting it here at runtime has no effect; rebuild with
      # `--build-arg API_PROXY_URL=…` if you need a different target.
      #
      # `COMIC_API_BASE` IS runtime — it's what RSC pages (`web/lib/api/
      # fetch.ts`) use to call the Rust server during SSR. Must point at
      # the compose-internal service name; the user's browser never sees
      # this URL.
      COMIC_API_BASE: http://app:8080
      NODE_ENV: production
    # `web` is internal-only on the compose bridge — `app` reverse-
    # proxies HTML requests here via `COMIC_WEB_UPSTREAM_URL`. There is
    # no need (and as of M5, no supported configuration) to bind the
    # Next port to the host.
    expose:
      - "3000"
    healthcheck:
      # distroless-nodejs has /nodejs/bin/node on PATH. A tiny inline GET to
      # `/` proves the Next process is serving HTML.
      test:
        - "CMD"
        - "/nodejs/bin/node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    logging: *default-logging
    # Postgres parallel query allocates its shared memory under /dev/shm,
    # and Docker's default is 64 MB. Under concurrent entity-list requests
    # at 50,000 issues Postgres returned "could not resize shared memory
    # segment ... No space left on device" with the default.
    shm_size: 256mb
    # The official entrypoint starts as root, makes sure the data and socket
    # directories belong to `postgres`, then switches to that user:
    # SETUID/SETGID for the switch, CHOWN + FOWNER for the ownership and
    # mode fixes, DAC_READ_SEARCH to walk the data directory (mode 0700,
    # owned by `postgres`) as root. The tmpfs holds the socket and lock
    # file; everything else (temp files included) lives in the data volume.
    <<: *hardening
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETUID, SETGID]
    tmpfs:
      - /var/run/postgresql:size=1m
    networks: [backend]
    environment:
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: comic_reader
    volumes:
      # 18+ images require the mount at /var/lib/postgresql (data lives in a
      # major-versioned subdir, e.g. 18/docker/) and refuse to start when
      # anything is mounted at the pre-18 /var/lib/postgresql/data path.
      # Existing deployments with a volume initialized under an older major
      # must dump/restore (or pg_upgrade) — the 18 entrypoint detects the old
      # cluster and prints instructions rather than corrupting it.
      # See https://github.com/docker-library/postgres/pull/1259.
      - comic_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic -d comic_reader"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    logging: *default-logging
    # The image entrypoint starts as root and switches to the `redis` user
    # with setpriv: SETUID/SETGID for that switch. SKIP_FIX_PERMS turns off
    # its ownership repair of /data, which would need CHOWN and
    # DAC_READ_SEARCH; the volume is owned by `redis` already (a fresh
    # volume inherits the image's /data, and earlier versions of this file
    # ran the repair on every start).
    <<: *hardening
    cap_add: [SETUID, SETGID]
    networks: [backend]
    environment:
      SKIP_FIX_PERMS: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # With REDIS_PASSWORD set, `requirepass` reaches redis-server as a
    # config file on stdin, so the password is not on its command line
    # (`docker ps`, `ps`). `$$` stops compose substituting the value into
    # this command; the container's shell expands it at start.
    command:
      - sh
      - -c
      - |
        set -eu
        pw="$${REDIS_PASSWORD:-}"
        unset REDIS_PASSWORD
        if [ -z "$$pw" ]; then
          exec docker-entrypoint.sh redis-server --save 60 1000 --appendonly yes
        fi
        case "$$pw" in
          *[!A-Za-z0-9._~-]*)
            echo "REDIS_PASSWORD may contain only letters, digits and - . _ ~" >&2
            exit 1 ;;
        esac
        exec docker-entrypoint.sh redis-server - --save 60 1000 --appendonly yes <<EOF
        requirepass $$pw
        EOF
    volumes:
      - comic_redis:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password off redis-cli's command line.
      test:
        - "CMD-SHELL"
        - '[ -z "$$REDIS_PASSWORD" ] || export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
  # No route off the host, and `web` is not attached: only app, postgres
  # and redis can connect to each other here.
  backend:
    internal: true

volumes:
  comic_data:
  comic_postgres:
  comic_redis:
