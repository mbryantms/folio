# Self-contained smoke test for the production images.
#
# Invocation:
#   docker compose -f compose.test.yml up --abort-on-container-exit --exit-code-from smoke
#
# This is the verification matrix that `just docker-test` runs against
# locally-built images (`folio:dev` + `folio-web:dev` from `just docker-build`).
# It mirrors `compose.prod.yml` topology but with empty volumes + a smoke
# service so the run doesn't depend on the operator's real library / .env.

# Own project name: compose derives the default from the directory, so this
# file and compose.dev.yml would otherwise share "folio" — `up` then RECREATES
# the dev postgres/redis with the smoke config and `down --remove-orphans`
# deletes dex. (The dev data itself survives: it is a bind mount.)
name: folio-smoke

services:
  # See `compose.prod.yml` for rationale — distroless nonroot can't write
  # a freshly-created named volume without this fixup.
  app-init:
    image: mirror.gcr.io/library/alpine:3@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    restart: "no"
    command:
      - sh
      - -c
      - "mkdir -p /data && chown -R 65532:65532 /data && chmod 0700 /data"
    volumes:
      - smoke_data:/data

  app:
    image: folio:dev
    depends_on:
      app-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      COMIC_DATABASE_URL: postgres://comic:smoke@postgres:5432/comic_reader
      COMIC_REDIS_URL: redis://redis:6379
      COMIC_PUBLIC_URL: http://localhost:${SMOKE_APP_PORT:-8080}
      COMIC_AUTH_MODE: local
      COMIC_AUTO_MIGRATE: "true"
      COMIC_TRUSTED_PROXIES: "172.16.0.0/12"
      # The Rust origin proxies HTML to the Next upstream (rust-public-origin);
      # without this the default `localhost:3000` points at nothing inside
      # the container and every page 502s.
      COMIC_WEB_UPSTREAM_URL: http://web:3000
      # The Playwright `setup` project (web/tests/e2e/admin.setup.ts)
      # registers the first user (auto-admin) through the sign-in page. Defaults to false; a fresh volume seeds the
      # app_setting overlay from this value, so always `down --volumes`.
      COMIC_LOCAL_REGISTRATION_OPEN: "true"
      # 5/min/IP on login+register is hostile to a browser suite that
      # registers, signs out and signs back in from one source IP.
      COMIC_RATE_LIMIT_ENABLED: "false"
    # Published for the Playwright suite (PLAYWRIGHT_BASE_URL=http://localhost:8080).
    # `__Host-` cookies need a trustworthy origin: localhost/127.0.0.1 only.
    ports:
      - "127.0.0.1:${SMOKE_APP_PORT:-8080}:8080"
    volumes:
      # A generated library (three series: the reader-flow CBZ plus two
      # volumes of one title for the relationship-suggestion spec) so a scan
      # has something to find — an empty root fails validation before the
      # scan starts. Generate with
      # `node web/tests/e2e/fixtures/make-library.mjs`; override the path via
      # SMOKE_LIBRARY_DIR.
      - ${SMOKE_LIBRARY_DIR:-./web/tests/e2e/.library}:/library:ro
      - smoke_data:/data
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    image: folio-web:dev
    depends_on:
      app:
        condition: service_healthy
    environment:
      # `API_PROXY_URL` is baked at build time (see web/Dockerfile);
      # `COMIC_API_BASE` is read at runtime for RSC SSR.
      COMIC_API_BASE: http://app:8080
      NODE_ENV: production
    healthcheck:
      test:
        - "CMD"
        - "/nodejs/bin/node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: comic_reader
    # 18+ images refuse to start with anything mounted at the pre-18
    # /var/lib/postgresql/data path; the tmpfs goes on the parent instead.
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic -d comic_reader"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: mirror.gcr.io/library/redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  smoke:
    image: mirror.gcr.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    entrypoint:
      - sh
      - -euc
      - |
        echo "==> /healthz"
        curl -fsS http://app:8080/healthz | grep -q '"status":"ok"'
        echo "==> /readyz"
        curl -fsS http://app:8080/readyz  | grep -q '"status":"ready"'
        echo "==> web /sign-in renders HTML"
        curl -fsS -H 'Accept: text/html' http://web:3000/sign-in | grep -q '<form'
        echo "==> /sign-in through the Rust origin (proxy hop) renders HTML"
        curl -fsS -H 'Accept: text/html' http://app:8080/sign-in | grep -q '<form'
        echo "==> smoke OK"
    restart: "no"

volumes:
  smoke_data:
