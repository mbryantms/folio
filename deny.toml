# cargo-deny config — runs in CI per §16.1
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# Each entry below documents (a) which crate the advisory hits, (b)
# how it reaches our graph, (c) why we can accept it for now. Revisit
# on every dep-bump pass.
ignore = [
    # NOTE: stale entries pruned 2026-07-01 (audit DEP-1) — cargo-deny
    # reported these as `advisory-not-detected` (crate no longer in the
    # graph): RUSTSEC-2024-0384 (instant), RUSTSEC-2025-0134
    # (rustls-pemfile), RUSTSEC-2025-0111 (tokio-tar), RUSTSEC-2026-0002
    # (lru 0.12). Re-add if a dep bump reintroduces them.
    # Pruned 2026-09-15: RUSTSEC-2026-0173 (proc-macro-error2) — left the
    # graph when sea-orm 2.0.3 dropped sea-bae.
    # Pruned 2026-11-12: RUSTSEC-2025-0119 (number_prefix, via indicatif),
    # RUSTSEC-2024-0436 (paste) and RUSTSEC-2026-0192 (ttf-parser) — all
    # three left the graph with the comic-text-detector crate and its
    # candle / imageproc stack. So did `ureq 2` and the `webpki-roots
    # 0.26` copy behind the RUSTSEC-2026-0381 note (that crate turned on
    # hf-hub's default blocking client; Folio's hf-hub has no default
    # features), and the `memmap2` copy under candle (RUSTSEC-2026-0186).
    #
    # `crypto-bigint 0.5` timing variability in constant-time ops
    # (RUSTSEC-2026-0387, 2026-10-23). Patched only in the 0.7 line
    # (>= 0.7.6), i.e. the RustCrypto 0.14 release train; we get 0.5.5
    # via `p256`/`p384 0.13` ← `jsonwebtoken 11.1` and `openidconnect 4.0`,
    # both at their latest release and still pinned to `p256 ^0.13`, so no
    # bump on our side can clear it. Folio's own tokens are EdDSA
    # (`auth/jwt.rs`); the only ECDSA path is *verifying* an OIDC
    # provider's ES-signed id_token with the provider's public key, so no
    # secret of ours flows through the affected arithmetic.
    # Delete when `cargo tree -i crypto-bigint` shows no 0.5 (jsonwebtoken /
    # openidconnect move to p256 0.14).
    "RUSTSEC-2026-0387",
    # `rsa 0.9.10` Marvin Attack (RUSTSEC-2023-0071 / CVE-2023-49092) —
    # timing sidechannel in RSA *private-key* operations (decrypt/sign).
    # Fixed in `rsa` 0.10.0 (the advisory's patched range since 2026-11),
    # and Folio's own direct use, the `crates/server` dev-dep that makes
    # the mock OP's throwaway key for the OIDC tests, is on 0.10. The
    # 0.9.10 copy stays in the graph through two deps that have no
    # rsa-0.10 release yet (re-checked 2026-11-09): `openidconnect` 4.1
    # (unconditional dep; RS256 id_token *verification* is a public-key
    # op, not the affected path) and `jsonwebtoken` 11.1's `rust_crypto`
    # backend (Folio signs its own JWTs with Ed25519 —
    # `secrets::Secrets::jwt_signing` — so production never invokes the
    # RSA signer; only the OIDC test signs its mock id_tokens through
    # it). Drop this entry once both move to 0.10 and `cargo tree -i
    # rsa@0.9.10` comes back empty.
    "RUSTSEC-2023-0071",
    # `astral-tokio-tar` unmaintained (RUSTSEC-2026-0440, 2026-11-03): Astral
    # ended the crate; no fixed version. Test-only: `testcontainers` 0.28
    # (latest, dev-dependency of crates/server) uses it to pack the build
    # context / copy files into containers, over our own harness inputs. It
    # is not in the production binary. Delete when `cargo tree -i
    # astral-tokio-tar` is empty (testcontainers moves to another tar crate).
    "RUSTSEC-2026-0440",
    # Bundled SQLite < 3.54.0 can return uninitialized page-cache memory
    # when a database is opened together with a sibling `-wal` file whose
    # page size differs (RUSTSEC-2026-0459 / CVE-2026-119375, 2026-10-30).
    # Fixed in `libsqlite3-sys` 0.39, which nothing in the graph can take
    # yet: our 0.37.0 (bundled SQLite 3.51.3) comes from `sqlx-sqlite`
    # 0.9.0, the latest, which requires `>=0.30.1, <0.38.0`, under sea-orm
    # 2's `sqlx-sqlite` feature (re-checked 2026-11-09). Not reachable: the
    # one production open is `metadata::local_db::open`, on an
    # operator-chosen file, with `mode=ro&immutable=true` (sqlx forwards
    # the flag). SQLite treats an immutable open like a temp file and
    # never looks for a `-wal` (`act_like_temp_file` in the bundled
    # pager.c; also checked live: rows present only in the WAL are
    # invisible under `immutable=true`). The `mode=rwc` open in
    # tests/local_metadata_db.rs writes its own fixture. Delete when
    # sqlx-sqlite allows libsqlite3-sys 0.39 and `cargo tree -i
    # libsqlite3-sys` shows it.
    "RUSTSEC-2026-0459",
    # Pruned 2026-11-13 (`zip` < 9; the one affected copy, zip 8.6.0 under
    # tesseract-rs, left the graph with Tesseract, and Folio's zip is 9.5):
    # RUSTSEC-2026-0367, -0368, -0369 and -0429, and the GitHub-only
    # GHSA-m665-v7pm-7grj, GHSA-hjqx-j4rw-g7xv, GHSA-8hxf-qr8p-62x4 and
    # GHSA-9hj8-73fh-9963.
    # Pruned 2026-11-08: GHSA-qwgh-2vcv-g2f7 (block-buffer) — GitHub narrowed
    # the range to >=0.11, <0.12.1; our copies are 0.10.4 and 0.12.1.
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",                  # quoted_printable (lettre transitive); OSI zero-clause BSD
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",   # webpki-roots (rustls cert store); LF permissive
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    # `xxhash-rust` (redis ≥ 1.x transitive, RESP3 hashing). Boost Software
    # License 1.0: OSI-approved, permissive, no copyleft.
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps (`{ path = "../foo" }`) legitimately omit a
# `version =` constraint; they're internal and resolved by the
# workspace. Without this exemption cargo-deny flags every internal
# crate dependency as a wildcard violation.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
