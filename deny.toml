# cargo-deny config — runs in CI per §16.1
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# Each entry below documents (a) which crate the advisory hits, (b)
# how it reaches our graph, (c) why we can accept it for now. Revisit
# on every dep-bump pass.
ignore = [
    # NOTE: stale entries pruned 2026-07-01 (audit DEP-1) — cargo-deny
    # reported these as `advisory-not-detected` (crate no longer in the
    # graph): RUSTSEC-2024-0384 (instant), RUSTSEC-2025-0134
    # (rustls-pemfile), RUSTSEC-2025-0111 (tokio-tar), RUSTSEC-2026-0002
    # (lru 0.12). Re-add if a dep bump reintroduces them.
    # Pruned 2026-09-15: RUSTSEC-2026-0173 (proc-macro-error2) — left the
    # graph when sea-orm 2.0.3 dropped sea-bae.
    #
    # `number_prefix` unmaintained — transitive via indicatif (CLI
    # progress bars in scanner). Cosmetic formatter; no security
    # surface.
    "RUSTSEC-2025-0119",
    # `paste` no longer maintained — proc-macro used at build time by
    # several macro crates. Doesn't ship to runtime. Tracked upstream.
    "RUSTSEC-2024-0436",
    # `crypto-bigint 0.5` timing variability in constant-time ops
    # (RUSTSEC-2026-0387, 2026-10-23). Patched only in the 0.7 line
    # (>= 0.7.6), i.e. the RustCrypto 0.14 release train; we get 0.5.5
    # via `p256`/`p384 0.13` ← `jsonwebtoken 11.1` and `openidconnect 4.0`,
    # both at their latest release and still pinned to `p256 ^0.13`, so no
    # bump on our side can clear it. Folio's own tokens are EdDSA
    # (`auth/jwt.rs`); the only ECDSA path is *verifying* an OIDC
    # provider's ES-signed id_token with the provider's public key, so no
    # secret of ours flows through the affected arithmetic.
    # Delete when `cargo tree -i crypto-bigint` shows no 0.5 (jsonwebtoken /
    # openidconnect move to p256 0.14).
    "RUSTSEC-2026-0387",
    # --- OCR / ML stack (candle → comic-text-detector → imageproc), confined
    # to the optional OCR path; not reachable from the core reader/scanner
    # request paths. (audit DEP-1, 2026-07-01.)
    #
    # `ttf-parser 0.25.1` unmaintained (RUSTSEC-2026-0192) — transitive via
    # `imageproc → ab_glyph → owned_ttf_parser`. Upstream states "no safe
    # upgrade available"; the suggested alternative (`skrifa`) isn't adoptable
    # at our edge. Revisit when comic-text-detector bumps its imageproc pin.
    "RUSTSEC-2026-0192",
    # Pruned 2026-10-23: RUSTSEC-2026-0381 (webpki-roots 0.26 emSign roots)
    # — cargo-deny reports `advisory-not-detected` since 2026-10-22 although
    # 0.26.11 is still in the graph via `hf-hub 0.4 → ureq 2`; the advisory
    # was narrowed upstream. Re-add if it returns.
    # NOTE: `memmap2 0.9.10` unsound (RUSTSEC-2026-0186, transitive via
    # `candle-core`) is intentionally NOT ignored here — cargo-deny's DB does
    # not match it, so an ignore entry would only warn as
    # `advisory-not-detected`. cargo-audit surfaces it as a non-failing warning
    # (bare `cargo audit` exits 0 on unsound/informational). Revisit when
    # candle bumps its memmap2 pin.
    # `rsa 0.9.10` Marvin Attack (RUSTSEC-2023-0071 / CVE-2023-49092) —
    # timing sidechannel in RSA *private-key* operations (decrypt/sign).
    # Reaches the graph three ways: `openidconnect` 4 (unconditional dep;
    # RS256 id_token *verification* is a public-key op, not the affected
    # path), `jsonwebtoken`'s `rust_crypto` backend (Folio signs its own
    # JWTs with Ed25519 — `secrets::Secrets::jwt_signing` — so the RSA
    # signer is never invoked), and the `crates/server` dev-dep that
    # generates the mock OP's throwaway signing key for the OIDC tests
    # (private-key use, test-only). No fixed version exists: the advisory
    # range is open-ended and still covers the 0.10 release candidates
    # (re-checked 2026-09-15), so Renovate's dashboard keeps listing it
    # until RustCrypto ships a constant-time fix. Revisit on each pass.
    "RUSTSEC-2023-0071",
    # --- `zip` < 9 extraction advisories (2026-10-09 batch, patched only
    # in 9.x): RUSTSEC-2026-0367 (SUID/SGID bits preserved on extract),
    # -0368 (symlink targets escape the destination), -0369 (permissions
    # applied through symlinks). All three are about the whole-archive
    # helpers `ZipArchive::extract()` / `ZipStreamReader::extract()` run
    # over an attacker-controlled archive. Folio's own `zip` is the
    # patched 9.x line; the two stale copies are transitive pins we can't
    # move (re-checked 2026-10-19):
    #  - `zip 7.2.0` <- `candle-core 0.9.2` (`^7.2`, via
    #    comic-text-detector in the optional OCR/ML stack). Candle only
    #    opens `.npz` / PyTorch `.pt` tensor files with `by_index` / `by_name` reads and
    #    never calls `extract()`; the files are the operator's detector
    #    model, not user uploads. candle `main` still pins `zip 8.6.0`,
    #    so an upstream release wouldn't clear it yet either.
    #  - `zip 8.6.0` <- `tesseract-rs 0.4.0` build-dependency (`^8.6`,
    #    latest release). Its build.rs unpacks the pinned leptonica
    #    1.87.0 / tesseract 5.5.2 GitHub tag archives by iterating
    #    `by_index` + `io::copy` (no `extract()`), at build time only;
    #    nothing from it ships in the binary.
    # Revisit when candle and tesseract-rs move to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # --- `zip` < 9, 2026-10-29 batch: five GitHub advisories, patched in
    # 9.0.5 / 9.0.0. The RustSec db carries none of them (re-checked
    # 2026-10-30), so cargo-deny has nothing to match — a RUSTSEC-less id
    # in this array only warns as `advisory-not-detected` (the memmap2 gap
    # above) and reads as stale to the daily sweep. They are recorded on
    # the `osv-only:` lines below instead: osv-scanner is the one scanner
    # that reports them (it reads osv-scanner.toml), and
    # scripts/ci/check-advisory-ignores.py takes these lines as the
    # rationale of record behind that file's GHSA entries. Same two stale
    # copies as RUSTSEC-2026-0367..0369 (Folio's own zip is 9.1.2, patched
    # for all five): `zip 7.4.0` <- candle-core 0.9.2 and `zip 8.6.0` <-
    # tesseract-rs 0.4.0 build.rs. Both pull zip with
    # `default-features = false` (candle adds nothing, tesseract-rs adds
    # `deflate`), so `aes-crypto` and `legacy-zip` are not compiled in.
    #  - GHSA-m665-v7pm-7grj (CVE-2026-115905, <= 9.0.4, "zip cloaking"):
    #    the central-directory reader (`ZipArchive`) and the local-header
    #    reader (`ZipStreamReader`) disagree on an entry's name/contents,
    #    so a filesystem extract can write a path the inspecting reader
    #    never showed. Neither copy uses `ZipStreamReader` or `extract()`:
    #    candle opens `.npz` / `.pt` tensor files by name/index through
    #    `ZipArchive`, and the detector Folio ships loads an ONNX model
    #    through `ort`, so candle's zip reader is never even reached;
    #    tesseract-rs iterates `by_index` + `io::copy` over the pinned
    #    leptonica 1.87.0 / tesseract 5.5.2 GitHub tag archives at build
    #    time, and nothing from it ships in the binary.
    #  - GHSA-q7v9-x93c-xqv3 (CVE-2026-115909): unbounded symlink-target
    #    allocation in `ZipArchive::extract()`. Not called by either copy.
    #  - GHSA-hjqx-j4rw-g7xv (CVE-2026-115908): lexical symlink-target
    #    validation in `extract()`. Same.
    #  - GHSA-8hxf-qr8p-62x4 (CVE-2026-115906): AES-entry HMAC skipped on
    #    premature EOF. Needs `aes-crypto`, which neither copy enables.
    #  - GHSA-9hj8-73fh-9963 (CVE-2026-115907): Shrink/Reduce/Implode
    #    capacity-overflow panic in `extract()`. Needs `legacy-zip`, which
    #    neither copy enables.
    # Delete when candle and tesseract-rs move to zip 9 (the condition on
    # the three RUSTSEC entries above). Move an id into the array the day
    # the RustSec db gains an entry for it — the daily sweep's stale check
    # names it.
    # osv-only: GHSA-m665-v7pm-7grj GHSA-q7v9-x93c-xqv3 GHSA-hjqx-j4rw-g7xv
    # osv-only: GHSA-8hxf-qr8p-62x4 GHSA-9hj8-73fh-9963
    # `block-buffer 0.10.4` — a caught panic inside a hasher's compress
    # callback can leave the buffer's cursor out of bounds, and later use
    # of that same buffer reads/writes past the block (GHSA-qwgh-2vcv-g2f7,
    # moderate, 2026-08-19; no RustSec id as of 2026-10-30, so osv-only
    # like the zip batch). Patched only in 0.12.1, i.e. the `digest 0.11`
    # release train; 0.10.4 is pinned by `digest 0.10.7`, the train every
    # hashing dependency we have is still on — axum (`sha1`, WebSocket
    # handshake), axum-extra's `cookie` (`hmac` / `sha2`), sea-orm -> sqlx
    # (`sha2` / `hmac` / `md-5`, Postgres SCRAM), `curve25519-dalek 4` /
    # `ecdsa 0.16` <- jsonwebtoken 11.1 and openidconnect 4.0.1, and the
    # OCR stack — all at their latest releases, so no bump on our side can
    # clear it (the same shape as RUSTSEC-2026-0387 above). The exploit
    # needs code that catches a panic raised *inside* a hash update and
    # then keeps using that hasher: Folio has no `catch_unwind` of its own,
    # the two panic boundaries it runs under (tower-http's
    # `CatchPanicLayer` in `app.rs` and the tokio task boundary) drop the
    # unwound request's state, so a hasher never survives a panic to be
    # reused, and the sha1 / sha2 / hmac compress functions are branch-free
    # arithmetic over fixed-size blocks with no panic path of their own.
    # Delete when `cargo tree -i block-buffer@0.10.4` is empty (the
    # digest 0.10 consumers move to digest 0.11).
    # osv-only: GHSA-qwgh-2vcv-g2f7
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",                  # quoted_printable (lettre transitive); OSI zero-clause BSD
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",   # webpki-roots (rustls cert store); LF permissive
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    # comic-text-detector ships under GPL-3.0-or-later. Folio is
    # AGPL-3.0-or-later; the GPL family is one-way compatible into AGPL
    # (AGPL is GPL + the network-use clause).
    "GPL-3.0-or-later",
    # `libfuzzer-sys` carries the trifecta `(MIT OR Apache-2.0) AND
    # NCSA`. NCSA is the University of Illinois open-source license
    # used by LLVM-adjacent projects; OSI-approved + FSF-free.
    "NCSA",
    # `xxhash-rust` (redis ≥ 1.x transitive, RESP3 hashing). Boost Software
    # License 1.0: OSI-approved, permissive, no copyleft.
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps (`{ path = "../foo" }`) legitimately omit a
# `version =` constraint; they're internal and resolved by the
# workspace. Without this exemption cargo-deny flags every internal
# crate dependency as a wildcard violation.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
