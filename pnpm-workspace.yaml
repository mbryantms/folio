packages:
  - "web"

# pnpm 11 errors (ERR_PNPM_IGNORED_BUILDS) when a dependency's install
# script is skipped without an explicit per-package decision, where
# pnpm 10 only warned. These are optional native build scripts whose
# packages ship prebuilt binaries; main ran with all of them skipped, so
# deny each one here (false = don't run the script) to keep `pnpm install`
# non-interactive in CI while preserving that behavior.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

# pnpm 11 stopped reading the `pnpm` field in package.json (incl.
# `pnpm.overrides`); settings now live here. These are security pins —
# keep them in sync with the renovate.json package rules.
# Override-review convention (dependency-pipeline audit 2026-07-02):
# every entry carries the advisory + a delete-when condition. Overrides
# rot — once every dependent's range clears the vulnerable versions,
# DELETE the entry rather than letting renovate bump it forever
# (renovate majors on overrides are disabled in renovate.json).
overrides:
  # GHSA lodash prototype-pollution line; transitive dev/tooling copies.
  # Delete when `pnpm why lodash` shows no in-range <4.18.0 consumers.
  "lodash@<4.18.0": "4.18.1"
  # GHSA js-yaml <4.1.1 code-execution hardening + GHSA-52cp-r559-cp3m
  # (<4.3.0 quadratic-CPU merge-key DoS) + GHSA-5p4m-2wfm-xmqj (<4.3.1
  # quadratic-CPU `!!omap` DoS); transitive tooling only —
  # @redocly/openapi-core@1.34.x exact-pins 4.2.0 so it can't float.
  # NOTE: the upper bound must stay one patch AHEAD of the pinned value.
  # The selector is exclusive, so a key of `<4.3.0` pinning "4.3.0" stops
  # matching its own output — 4.3.0 then escapes the override and the next
  # advisory against it goes unremediated (that is exactly how
  # GHSA-5p4m-2wfm-xmqj slipped through).
  # Delete when `pnpm why js-yaml` shows no in-range consumers.
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  # GHSA postcss <8.5.10 parsing advisory; build-chain only.
  # Delete when `pnpm why postcss` shows no in-range consumers.
  "postcss@<8.5.10": "8.5.25"
  # GHSA-2v37-7h3g-55p8 — nanoid custom generators loop indefinitely when
  # `size` is 0 (DoS). Reaches us prod-side through the Scalar API-reference
  # Vue chain (…>vue>@vue/compiler-sfc>postcss>nanoid); postcss's own range
  # is ^3.3.11, so pinning postcss above does NOT lift nanoid off the
  # vulnerable line — it needs its own entry.
  # The advisory's second range (>=4.0.0 <5.1.6) needs no entry: the only
  # 5.x copy we resolve is 5.1.16, already past it.
  # Delete when `pnpm why nanoid` shows no in-range consumers.
  "nanoid@<3.3.17": "3.3.17"
  # GHSA-f88m-g3jw-g9cj — sharp <0.35.0 inherited libvips CVEs
  # (CVE-2026-33327/-33328/-35590/-35591). Prod path: next pins
  # sharp ^0.34.5 so it can't float to the patched line.
  # Delete when next's sharp range reaches >=0.35.0.
  "sharp@<0.35.0": "0.35.3"
  # GHSA-gv7w-rqvm-qjhr — esbuild <0.28.1 missing binary integrity
  # verification (RCE via NPM_CONFIG_REGISTRY). Reaches us only through
  # the @serwist build toolchain + the vite/vitest dev stack, never the
  # shipped bundle, but the audit gate is severity-based. Holds the
  # transitive copies on the patched line.
  "esbuild@<0.28.1": "0.28.1"
  # brace-expansion DoS pair — GHSA-mh99-v99m-4gvg (<=5.0.7, unbounded
  # expansion length) and GHSA-rgw5-rvv9-x895 (unbounded intermediate
  # arrays, which bypasses the first one's mitigation). Between them they
  # span every major we resolve: 1.1.16, 2.1.2 and the 5.x copies
  # (glob→minimatch v10 chains, incl. the @serwist prod path).
  #
  # The 1.x/2.x copies previously had NO patched backport and were accepted
  # in SECURITY-EXCEPTIONS.md. That is no longer true: rgw5 shipped patches
  # on every line (1.1.18 / 2.1.4 / 5.0.9), and mh99's backports (1.1.17 /
  # 2.1.3) landed alongside. Pinning each line to its own patched release
  # keeps every consumer inside its original major, so the CJS export-shape
  # break that made 5.0.8 unusable for minimatch v3 does not apply.
  # Delete each when `pnpm why brace-expansion` shows no in-range consumers.
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
