# osv-scanner configuration for the daily dependency-health sweep
# (`.github/workflows/advisories.yml`, job `osv`).
#
# OSV aggregates the same RustSec advisories that `cargo audit` and
# `cargo deny` read, but it does NOT honour `.cargo/audit.toml`,
# `deny.toml` or `pnpm-workspace.yaml` — so every accepted-risk advisory
# has to be restated here or the sweep fails on findings triaged weeks
# earlier (issue #1208, 2026-10-25: the three `zip` <9 ids and
# `crypto-bigint` were accepted in deny.toml + audit.toml but never
# mirrored). `scripts/ci/check-advisory-ignores.py` now fails CI when
# this file and those three drift in either direction, so this list is
# exactly: every RUSTSEC id in deny.toml ∪ .cargo/audit.toml, plus every
# GHSA on an `osv-only:` line in deny.toml (a Rust advisory the RustSec db
# has no id for yet, so only this scanner reports it), plus every GHSA in
# pnpm-workspace.yaml `auditConfig.ignoreGhsas`. The full rationale and
# the "delete when…" condition for each live next to the entry in those
# files; the reasons here are the one-line summary.

# ── Rust (mirrored from deny.toml + .cargo/audit.toml) ──────────────

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "`rsa 0.9.10` Marvin Attack — transitive via jsonwebtoken / openidconnect; we sign JWTs with Ed25519 only and RS256 id_token verification is a public-key op. Fixed in rsa 0.10 (our OIDC test dev-dep is on it); delete when jsonwebtoken and openidconnect move to 0.10 and `cargo tree -i rsa@0.9.10` is empty."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "`crypto-bigint 0.5.5` constant-time variability — patched only in 0.7.6+ (RustCrypto 0.14 train); reaches us via p256/p384 0.13 from jsonwebtoken 11.1 + openidconnect 4.0.1, both latest and pinned to p256 ^0.13. Only ECDSA *verification* of OIDC id_tokens; our tokens are EdDSA. Delete when `cargo tree -i crypto-bigint` shows no 0.5."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "Bundled SQLite <3.54 returns uninitialized page-cache memory with a mismatched `-wal` sibling — libsqlite3-sys 0.37 is pinned by sqlx-sqlite 0.9.0 (latest, `<0.38`; fix is 0.39). Folio's only open, `metadata::local_db::open`, uses `immutable=true`, which never reads a WAL. Delete when sqlx-sqlite allows libsqlite3-sys 0.39."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
reason = "`astral-tokio-tar` unmaintained — test-only, via testcontainers 0.28 (latest); not in the production binary. Delete when testcontainers moves off it."

# ── Rust, GitHub-advisory-only (mirrored from the `osv-only:` lines in ──
# deny.toml). The RustSec db has no id for these yet, so cargo-deny and
# cargo-audit cannot be told about them; this is the one scanner that
# reports them. Full rationale sits above the `osv-only:` line in
# deny.toml. When RustSec assigns an id, move the entry up into the Rust
# section under that id (osv-scanner filters aliases too) and move the
# id from the `osv-only:` line into deny.toml's `ignore` array.
#
# None at present.

# ── npm (mirrored from pnpm-workspace.yaml auditConfig.ignoreGhsas) ──
# Rationale for each lives in SECURITY-EXCEPTIONS.md.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "`deepmerge` <=4.3.1 prototype poisoning in mergeObject() (low) — no patched release exists. Dev-only: the shadcn 4.23.0 CLI > @shadcn/registry > deepmerge, run by developers and the weekly shadcn-refresh.yml over the shadcn registry's own JSON; never in the shipped images. Delete when deepmerge ships a fix or shadcn drops it."
