# cargo-audit configuration. Mirrors the `ignore` list in `deny.toml`
# so the CI `cargo audit` step (run separately from `cargo deny check`)
# doesn't relitigate the same upstream-stuck advisories. Update both
# files together on every dep-bump pass, and restate every id in
# `osv-scanner.toml` — `scripts/ci/check-advisory-ignores.py` fails CI
# when the three lists drift, and the daily sweep flags an entry here
# whose advisory no longer matches any lockfile version.
#
# Pruned 2026-10-25 (stale — the crate left the graph or moved past the
# patched version; see `cargo tree`): RUSTSEC-2024-0384 (instant),
# RUSTSEC-2025-0134 (rustls-pemfile), RUSTSEC-2025-0111 (tokio-tar),
# RUSTSEC-2026-0002 (lru 0.12 → 0.19), RUSTSEC-2026-0186 (memmap2 0.9.10
# → 0.9.11), RUSTSEC-2026-0235 (rkyv no longer in Cargo.lock),
# RUSTSEC-2026-0381 (webpki-roots 0.26.11 is explicitly unaffected).

[advisories]
ignore = [
    # `number_prefix` unmaintained (transitive via indicatif).
    "RUSTSEC-2025-0119",
    # `paste` no longer maintained (build-time proc-macro).
    "RUSTSEC-2024-0436",
    # `rsa 0.9.10` Marvin Attack — private-key timing sidechannel. In the
    # graph via openidconnect (public-key RS256 verify only), jsonwebtoken
    # (we sign with Ed25519), and the OIDC test's throwaway mock-OP key.
    # No fixed version exists; deny.toml carries the full rationale.
    "RUSTSEC-2023-0071",
    # `crypto-bigint 0.5.5` timing variability in constant-time ops
    # (RUSTSEC-2026-0387). Patched only in the 0.7 line; in the graph via
    # p256/p384 0.13 from jsonwebtoken 11.1 + openidconnect 4.0, both at
    # their latest and pinned to p256 ^0.13. Only ECDSA *verification* of
    # OIDC id_tokens; our own tokens are EdDSA. deny.toml carries the full
    # rationale and the delete-when condition.
    "RUSTSEC-2026-0387",
    # `zip` < 9 extraction advisories (SUID/SGID bits, symlink escape,
    # permissions through symlinks) - all about `ZipArchive::extract()` /
    # `ZipStreamReader::extract()` over attacker-controlled archives.
    # Folio's own zip is 9.x (patched); the stale copies are stuck
    # transitive pins: `zip 7.4.0` <- candle-core 0.9.2 (`.npz` / `.pt` reads by
    # name/index in the optional OCR stack) and `zip 8.6.0` <-
    # tesseract-rs 0.4.0 build.rs (unpacks pinned tesseract/leptonica
    # source tags at build time). Neither calls `extract()`. deny.toml
    # carries the full rationale. Revisit when either bumps to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # Same stale `zip` copies: `ZipArchive::extract()` aborts on a crafted
    # symlink entry (was GHSA-q7v9-x93c-xqv3). Neither copy calls `extract()`.
    "RUSTSEC-2026-0429",
    # `astral-tokio-tar` unmaintained: test-only, via testcontainers 0.28
    # (latest). deny.toml carries the full rationale.
    "RUSTSEC-2026-0440",
    # Bundled SQLite < 3.54 with a mismatched `-wal` sibling: libsqlite3-sys
    # 0.37 is pinned by sqlx-sqlite 0.9.0 (latest, `<0.38`); the fix is
    # 0.39. Folio's only open (`local_db::open`) is `immutable=true`, which
    # never reads a WAL. deny.toml carries the full rationale.
    "RUSTSEC-2026-0459",
    # No entry for the rest of the 2026-10-29 `zip` GHSA batch
    # (GHSA-m665-v7pm-7grj, -hjqx-j4rw-g7xv, -8hxf-qr8p-62x4,
    # -9hj8-73fh-9963): the RustSec db has no id for them (2026-11-08), so cargo-audit never reports them and
    # an unknown id here would read as stale. They are accepted on the
    # `osv-only:` lines in deny.toml and mirrored in osv-scanner.toml; add
    # the RUSTSEC id here and in deny.toml once the db assigns one.
]
