# cargo-audit configuration. Mirrors the `ignore` list in `deny.toml`
# so the CI `cargo audit` step (run separately from `cargo deny check`)
# doesn't relitigate the same upstream-stuck advisories. Update both
# files together on every dep-bump pass, and restate every id in
# `osv-scanner.toml` — `scripts/ci/check-advisory-ignores.py` fails CI
# when the three lists drift, and the daily sweep flags an entry here
# whose advisory no longer matches any lockfile version.
#
# Pruned 2026-10-25 (stale — the crate left the graph or moved past the
# patched version; see `cargo tree`): RUSTSEC-2024-0384 (instant),
# RUSTSEC-2025-0134 (rustls-pemfile), RUSTSEC-2025-0111 (tokio-tar),
# RUSTSEC-2026-0002 (lru 0.12 → 0.19), RUSTSEC-2026-0186 (memmap2 0.9.10
# → 0.9.11), RUSTSEC-2026-0235 (rkyv no longer in Cargo.lock),
# RUSTSEC-2026-0381 (webpki-roots 0.26.11 is explicitly unaffected).
# Pruned 2026-11-12: RUSTSEC-2025-0119 (number_prefix) and
# RUSTSEC-2024-0436 (paste) left the graph with the comic-text-detector
# crate and its candle / imageproc stack.
# Pruned 2026-11-13: RUSTSEC-2026-0367, -0368, -0369 and -0429 (zip < 9)
# left the graph with tesseract-rs, whose build script pulled zip 8.6.0.

[advisories]
ignore = [
    # `rsa 0.9.10` Marvin Attack — private-key timing sidechannel, fixed
    # in 0.10 (our OIDC test dev-dep is on it). 0.9.10 stays in the graph
    # via openidconnect (public-key RS256 verify only) and jsonwebtoken
    # (we sign with Ed25519); deny.toml carries the full rationale.
    "RUSTSEC-2023-0071",
    # `crypto-bigint 0.5.5` timing variability in constant-time ops
    # (RUSTSEC-2026-0387). Patched only in the 0.7 line; in the graph via
    # p256/p384 0.13 from jsonwebtoken 11.1 + openidconnect 4.0, both at
    # their latest and pinned to p256 ^0.13. Only ECDSA *verification* of
    # OIDC id_tokens; our own tokens are EdDSA. deny.toml carries the full
    # rationale and the delete-when condition.
    "RUSTSEC-2026-0387",
    # `astral-tokio-tar` unmaintained: test-only, via testcontainers 0.28
    # (latest). deny.toml carries the full rationale.
    "RUSTSEC-2026-0440",
    # Bundled SQLite < 3.54 with a mismatched `-wal` sibling: libsqlite3-sys
    # 0.37 is pinned by sqlx-sqlite 0.9.0 (latest, `<0.38`); the fix is
    # 0.39. Folio's only open (`local_db::open`) is `immutable=true`, which
    # never reads a WAL. deny.toml carries the full rationale.
    "RUSTSEC-2026-0459",
]
